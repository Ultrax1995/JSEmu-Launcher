name: Build and Release JSEmu Launcher

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 Launcher
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Display .NET information
        run: dotnet --info

      - name: Resolve launcher version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"

            if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:\.\d+)?)$') {
              throw "Release tag must look like v3.5.3 or v3.5.3.0"
            }

            $version = $Matches.version
          }
          else {
            [xml]$project = Get-Content "JSEmu Launcher/H1Emu Launcher.csproj"

            $group = $project.Project.PropertyGroup |
              Where-Object { $_.Version } |
              Select-Object -First 1

            $version = [string]$group.Version

            if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Could not read <Version> from H1Emu Launcher.csproj"
            }
          }

          $parts = $version.Split('.')

          if ($parts.Count -eq 3) {
            $fileVersion = "$version.0"
          }
          elseif ($parts.Count -eq 4) {
            $fileVersion = $version
          }
          else {
            throw "Invalid version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT

          Write-Host "Build version: $version"
          Write-Host "Assembly/File version: $fileVersion"

      - name: Publish launcher as single EXE
        shell: pwsh
        run: |
          dotnet publish "JSEmu Launcher/H1Emu Launcher.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "publish/JSEmu-Launcher-win-x64" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version="${{ steps.version.outputs.version }}" `
            -p:AssemblyVersion="${{ steps.version.outputs.file_version }}" `
            -p:FileVersion="${{ steps.version.outputs.file_version }}" `
            -p:InformationalVersion="${{ steps.version.outputs.version }}"

      - name: Verify compiled EXE
        shell: pwsh
        run: |
          $exe = "publish/JSEmu-Launcher-win-x64/JSEmu Launcher.exe"

          if (!(Test-Path $exe)) {
            Write-Host "Files found in publish directory:"
            Get-ChildItem "publish/JSEmu-Launcher-win-x64" -Recurse
            throw "JSEmu Launcher.exe was not created."
          }

          $expected = "${{ steps.version.outputs.file_version }}"
          $actual = (Get-Item $exe).VersionInfo.FileVersion

          Write-Host "Expected version: $expected"
          Write-Host "Built EXE version: $actual"

          if ($actual -ne $expected) {
            throw "Built launcher has the wrong FileVersion."
          }

          Get-Item $exe | Format-List FullName, Length

      # Builds that are not a release tag still produce a testable exe
      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: JSEmu-Launcher-${{ steps.version.outputs.version }}
          path: "publish/JSEmu-Launcher-win-x64/JSEmu Launcher.exe"
          retention-days: 7

      - name: Create GitHub Release and upload EXE
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "publish/JSEmu-Launcher-win-x64/JSEmu Launcher.exe"

          if (gh release view $tag 2>$null) {
            gh release upload $tag $exe --clobber
          }
          else {
            gh release create $tag `
              $exe `
              --verify-tag `
              --title "JSEmu Launcher $tag" `
              --generate-notes
          }
